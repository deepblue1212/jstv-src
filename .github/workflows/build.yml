name: Build filtered source

# ================= 改这里就能调整保留哪些源（改完提交即自动重建）=================
env:
  UPSTREAM: "https://9280.kstore.vip/cat/index.js"
  # 订阅目录必须四件套齐全：index.js / index.js.md5 / index.config.js / index.config.js.md5
  # 缺 index.config.js 会被 App 判定为「下载失败」
  UPSTREAM_CONFIG: "https://9280.kstore.vip/cat/index.config.js"
  KEEP: "豆瓣|首页"
  KEEP_CONTAINS: "秒播"
  OUT_DIR: "jstv"
# ================================================================================

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  schedule:
    # 每天 20:00 UTC（北京时间次日 04:00）跟随上游自动重建
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取上游、套用白名单并自检
        run: |
          cat > /tmp/build.js <<'JSEOF'
          'use strict';
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');

          const UPSTREAM = process.env.UPSTREAM;
          const UPSTREAM_CONFIG = process.env.UPSTREAM_CONFIG;
          const OUT_DIR = process.env.OUT_DIR || 'jstv';
          const KEEP = (process.env.KEEP || '').split(',').map((s) => s.trim()).filter(Boolean);
          const KEEP_CONTAINS = (process.env.KEEP_CONTAINS || '').split(',').map((s) => s.trim()).filter(Boolean);

          function esc(s) {
            return s.replace(/[^\x20-\x7e]/g, (c) => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0').toUpperCase());
          }

          function buildFilter() {
            const conds = [];
            for (const k of KEEP) conds.push('n===' + esc(JSON.stringify(k)));
            for (const c of KEEP_CONTAINS) conds.push('n.indexOf(' + esc(JSON.stringify(c)) + ')>=0');
            return '.filter(function(t){var n=String(t&&t.meta&&t.meta.name||"");return ' + (conds.join('||') || 'false') + '})';
          }

          // 只认代码结构，不认压缩后的变量名。上游每次重新压缩都会换掉 qm0/zm0/Um0 这类名字，
          // 但「X=await Y(Z);e.spiders=X,」这段赋值结构是稳定的。
          const ANCHOR = /([A-Za-z_$][\w$]*)\s*=\s*await\s+([A-Za-z_$][\w$]*)\(([A-Za-z_$][\w$]*)\)\s*;\s*(e\.spiders\s*=\s*\1\s*[,;])/;

          (async () => {
            console.log('上游: ' + UPSTREAM);
            console.log('Node ' + process.version);
            const res = await fetch(UPSTREAM, {
              headers: { 'user-agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)' },
              redirect: 'follow',
            });
            if (!res.ok) throw new Error('上游返回 HTTP ' + res.status);
            const src = await res.text();
            if (src.length < 100000) throw new Error('上游内容异常，仅 ' + src.length + ' 字符');
            console.log('上游大小: ' + src.length + ' 字符');

            const hit = src.match(ANCHOR);
            if (!hit) {
              throw new Error('未找到源注册锚点（形如 X=await Y(Z);e.spiders=X,）。上游结构可能已变更，需人工核对后再改脚本。');
            }

            const anchorIdx = src.search(ANCHOR);
            const arrVar = hit[1];
            const wrapper = hit[2];
            const argVar = hit[3];
            const tail = hit[4];

            // 锚点所在的外层函数（真正给 e.spiders 赋值、并据此注册路由的那个）
            const decls = [...src.slice(0, anchorIdx).matchAll(/(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(/g)];
            if (!decls.length) throw new Error('无法定位锚点所在的外层函数');
            const setupFn = decls[decls.length - 1][1];

            const filter = buildFilter();
            console.log('锚点命中: ' + hit[0]);
            console.log('源注册函数: ' + wrapper + '（压缩后的名字，脚本不依赖）');
            console.log('外层函数: ' + setupFn + '（压缩后的名字，脚本不依赖）');
            console.log('过滤条件: ' + filter);

            const repl = arrVar + '=(await ' + wrapper + '(' + argVar + '))' + filter + ';' + tail;
            const patched = src.replace(ANCHOR, () => repl);
            if (patched === src) throw new Error('补丁未生效（替换后内容无变化）');

            fs.mkdirSync(OUT_DIR, { recursive: true });
            const outFile = path.join(OUT_DIR, 'index.js');
            fs.writeFileSync(outFile, patched);

            // 自检：把产物真实执行一遍。e.spiders 是外层函数早期就赋值的，
            // 所以后续步骤（注册路由、写 db）即使抛错也不影响取结果。
            const PROBE =
              '\n;(async()=>{try{\n' +
              '  const e={config:{pan:{maxLinksPerProvider:10,showTranscode:true,showUcUnlimited:false,priority:[]}},\n' +
              '    credentials:{getCredential:async()=>undefined,setCredential:async()=>{}},\n' +
              '    db:{get:async()=>undefined,set:async()=>{},delete:async()=>{}},\n' +
              '    messageToDart:async()=>{},remoteWexConfig:{}};\n' +
              '  e.decorate=function(k,v){e[k]=v};\n' +
              '  e.register=async function(){};\n' +
              '  e.get=async function(){};e.post=async function(){};e.put=async function(){};e.delete=async function(){};\n' +
              '  try{ await ' + setupFn + '(e) }catch(_e){}\n' +
              '  const n=e.spiders;\n' +
              '  if(!Array.isArray(n)) throw new Error("未能取得源列表");\n' +
              '  console.log("COUNT="+n.length);\n' +
              '  console.log("LIST="+n.map(x=>String(x&&x.meta&&x.meta.name||"")).join(" | "));\n' +
              '}catch(err){console.error("PROBE_ERR="+(err&&err.message));process.exit(3)}})();\n';

            const probeFile = path.join(os.tmpdir(), 'jstv_probe_' + Date.now() + '.js');
            fs.writeFileSync(probeFile, patched + PROBE);
            let stdout;
            try {
              stdout = execFileSync(process.execPath, [probeFile], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'pipe'],
                timeout: 180000,
                // 万一上游的自启动守卫变了，也强制禁掉，避免探针把服务跑起来卡死
                env: Object.assign({}, process.env, { CATVOD_DISABLE_AUTOSTART: '1' }),
              });
            } catch (e) {
              throw new Error('自检执行失败: ' + (e.stderr || e.message));
            } finally {
              try { fs.unlinkSync(probeFile); } catch {}
            }

            const c = stdout.match(/COUNT=(\d+)/);
            const l = stdout.match(/LIST=([^\n]*)/);
            if (!c || !l) throw new Error('自检未取得源清单，输出：' + stdout.slice(0, 500));

            const names = l[1].split(' | ').map((s) => s.trim()).filter(Boolean);
            if (names.length !== Number(c[1])) throw new Error('自检结果自相矛盾');
            if (names.length === 0) throw new Error('自检失败：源清单为空');
            if (names.length > 200) throw new Error('自检失败：源数量 ' + names.length + ' 明显异常，补丁可能未生效');

            // 严格断言：结果里不能出现任何白名单之外的源
            // （只检查「白名单项是否存在」抓不到补丁未生效的情况）
            for (const n of names) {
              const allowed = KEEP.includes(n) || KEEP_CONTAINS.some((k) => n.includes(k));
              if (!allowed) throw new Error('自检失败：结果里混入了白名单之外的源「' + n + '」，补丁未生效');
            }
            for (const k of KEEP) {
              if (!names.includes(k)) throw new Error('自检失败：白名单中的「' + k + '」未出现在结果里');
            }
            for (const k of KEEP_CONTAINS) {
              if (!names.some((n) => n.includes(k))) throw new Error('自检失败：白名单关键词「' + k + '」一个源都没匹配到');
            }

            console.log('源数量: ' + names.length);
            for (const n of names) console.log('  - ' + n);

            const md5 = crypto.createHash('md5').update(fs.readFileSync(outFile)).digest('hex');
            fs.writeFileSync(path.join(OUT_DIR, 'index.js.md5'), md5);
            fs.writeFileSync(path.join(OUT_DIR, 'SOURCES.txt'), names.join('\n') + '\n');
            console.log('MD5: ' + md5);

            // ---- 配置文件（默认配置模板）：原样搬运，md5 自算以保证成对 ----
            if (UPSTREAM_CONFIG) {
              const cres = await fetch(UPSTREAM_CONFIG, {
                headers: { 'user-agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)' },
                redirect: 'follow',
              });
              if (!cres.ok) throw new Error('配置文件上游返回 HTTP ' + cres.status);
              const cfg = await cres.text();
              if (cfg.length < 500) throw new Error('配置文件内容异常，仅 ' + cfg.length + ' 字符');
              const cfgFile = path.join(OUT_DIR, 'index.config.js');
              fs.writeFileSync(cfgFile, cfg);
              const cfgMd5 = crypto.createHash('md5').update(fs.readFileSync(cfgFile)).digest('hex');
              fs.writeFileSync(path.join(OUT_DIR, 'index.config.js.md5'), cfgMd5);
              console.log('配置文件: ' + cfg.length + ' 字符, MD5: ' + cfgMd5);
            }

            console.log('完成');
          })().catch((e) => {
            console.error('构建失败: ' + (e && e.message));
            process.exit(1);
          });
          JSEOF
          node /tmp/build.js

      - name: 提交产物
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR"
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "build: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
